<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four</title>
<style>
:root{--bg:#f4f1ea;--fg:#1f1d1a;--card:#fff;--ac:#d9531e;--mu:#7a756c;--bd:#ddd6c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#f1ece0;--card:#25221b;--ac:#ff7a45;--mu:#a39c8c;--bd:#3a362c}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#f1ece0;--card:#25221b;--ac:#ff7a45;--mu:#a39c8c;--bd:#3a362c}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
#app{max-width:420px;margin:0 auto;padding:14px}
h1{margin:6px 0 14px;font-size:1.6rem}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{padding:18px 8px;font-weight:600}.menu span{display:block;font-size:2rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#sc{margin:10px 0;color:var(--mu);min-height:1.4em;text-align:center}
.grid{display:grid;gap:6px}.cell{aspect-ratio:1;font-size:1.6rem;padding:0;font-weight:700}.cell.o{background:var(--bd)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#2f5fc7;padding:6px;border-radius:12px}.dot{aspect-ratio:1;border-radius:50%;padding:0;background:#fff;border:0}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.kb button{width:13%;padding:8px 0}
.big{font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:.1em;margin:20px 0;min-height:2.6rem}
.bar{display:flex;gap:10px;justify-content:center;margin-bottom:10px}.bar button{flex:1;padding:14px}
.rt{width:100%;height:50vh;font-size:1.3rem;font-weight:700}
.cv{display:block;margin:0 auto;width:100%;max-width:340px;border:1px solid var(--bd);border-radius:12px;touch-action:none}
.hint{text-align:center;color:var(--mu)}
</style></head><body><div id="app">
<div class="top"><h1 style="margin:0">🔴 Connect Four</h1><button id="rs">↻ Restart</button></div><div id="sc"></div><div id="stage"></div>
</div>
<script>
const $=s=>document.querySelector(s),S=$('#stage'),say=t=>$('#sc').textContent=t;
const K=v=>getComputedStyle(document.documentElement).getPropertyValue(v);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.className='cv';S.appendChild(c);return[c,c.getContext('2d')]}
function ptr(c,fn){c.onpointermove=c.onpointerdown=e=>{const r=c.getBoundingClientRect();fn((e.clientX-r.left)/r.width*c.width)}}
const rnd=n=>Math.random()*n|0;


function c4(){const R=6,C=7;let b=[...Array(C)].map(()=>[]),over=0,turn=1;S.innerHTML='<div id="gr" class="c4"></div>';
const full=()=>b.every(x=>x.length>=R),g=(r,c)=>b[c]&&b[c][r];
function win(p){for(let c=0;c<C;c++)for(let r=0;r<R;r++)for(const[d,e]of[[1,0],[0,1],[1,1],[1,-1]]){let k=0;for(;k<4&&g(r+e*k,c+d*k)==p;k++);if(k==4)return 1}return 0}
function draw(){gr.innerHTML='';for(let r=R-1;r>=0;r--)for(let c=0;c<C;c++){const d=document.createElement('button');d.className='dot';const v=b[c][r];d.style.background=v==1?'#e03c31':v==2?'#f2b705':'';d.onclick=()=>play(c);gr.appendChild(d)}}
const drop=(c,p)=>b[c].length>=R?0:(b[c].push(p),1);
function play(c){if(over||turn!=1||!drop(c,1))return;draw();if(win(1)){over=1;say('You win! 🎉');return}if(full()){over=1;say('Draw');return}turn=2;say('Thinking…');setTimeout(ai,400)}
function ai(){let pick=-1;for(const p of[2,1])for(let c=0;c<C&&pick<0;c++)if(drop(c,p)){const w=win(p);b[c].pop();if(w)pick=c}
if(pick<0){const o=[3,2,4,1,5,0,6].filter(c=>b[c].length<R);pick=o[rnd(Math.min(o.length,3))]}
drop(pick,2);draw();turn=1;if(win(2)){over=1;say('AI wins 🤖')}else if(full()){over=1;say('Draw')}else say('Your turn (red)')}
draw();say('Your turn (red)')}
let stop=null;
function start(){if(stop)stop();S.innerHTML='';say('');stop=c4()}
$('#rs').onclick=start;start();
</script></body></html>
